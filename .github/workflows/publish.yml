# Publishes the app to npm with provenance, based on the create-twenty-app template.
# Provenance links the package to this public repo; the Twenty marketplace claim
# ("Claim with GitHub") relies on it.
#
# Auth: npm trusted publishing (OIDC). The NPM_TOKEN secret is only for the very
# first publish, before the package exists on npm and a trusted publisher can be
# registered (npmjs.com > package > Settings > Trusted Publisher > this repo,
# workflow publish.yml). Delete the secret after that.
#
# Run: push a tag `vX.Y.Z` that matches package.json, or start it from the Actions tab.
name: Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          registry-url: https://registry.npmjs.org

      - name: Update npm
        # Trusted publishing needs npm 11.5.1 or later.
        run: npm install -g npm@latest

      - name: Install dependencies
        run: yarn install --immutable

      - name: Check that the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"

      - name: Unit tests
        run: yarn test:unit

      - name: Publish to npm
        run: yarn twenty app:publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
